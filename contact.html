<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Contact - Collin M. Constantine</title>

  <meta
    name="description"
    content="Contact Collin M. Constantine — College Assistant Professor of Economics at Girton College, University of Cambridge."
  >

  <link rel="stylesheet" href="/styles.css">

  <style>
    /* Contact page: use the wider site canvas */

    .contact-page {
      margin: 3.5rem 0 4.5rem;
    }

    .contact-page h1 {
      margin: 0 0 2rem;
      font-size: 1.55rem;
      line-height: 1.25;
      color: #1f3a5f;
    }

    .contact-grid {
      display: grid;
      grid-template-columns:
        minmax(0, 1.7fr)
        minmax(220px, 0.85fr)
        minmax(170px, 0.55fr);
      gap: 3rem;
      align-items: start;
      width: 100%;
    }

    .contact-item {
      margin: 0;
      max-width: none;
    }

    .contact-label {
      margin: 0 0 0.55rem;
      font-size: 0.82rem;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6b7280;
    }

    .contact-value {
      margin: 0;
      font-size: 1rem;
      line-height: 1.7;
      color: #1a2b3c;
    }

    .contact-value a {
      color: #1f3a5f;
      text-decoration: none;
    }

    .contact-value a:hover {
      text-decoration: underline;
    }

    .contact-x-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .contact-x-mark {
      font-size: 1.35rem;
      line-height: 1;
      color: #000;
    }

    @media (max-width: 760px) {
      .contact-page {
        margin: 2.25rem 0 3rem;
      }

      .contact-page h1 {
        margin-bottom: 1.5rem;
        font-size: 1.35rem;
      }

      .contact-grid {
        grid-template-columns: 1fr;
        gap: 1.75rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">


    <header class="header">

      <div class="site-title">

        <a
          href="https://collinconstantine.com"
          class="site-title-link"
          rel="home"
        >
          Collin M. Constantine
        </a>

      </div>


      <button
        type="button"
        id="menu-btn"
        aria-label="Menu"
        aria-expanded="false"
        aria-controls="site-nav"
      >
        ☰
      </button>


      <nav
        class="nav"
        id="site-nav"
        role="navigation"
        aria-label="Main"
      >

        <a href="/">
          Home
        </a>

        <a href="/research.html">
          Papers
        </a>

        <a href="/RA.html">
          RA Positions
        </a>

        <a href="/about.html">
          Research Agenda
        </a>

        <a href="/media.html">
          Press
        </a>

        <a href="/MFI.html">
          MFI
        </a>

        <a
          href="/contact.html"
          aria-current="page"
        >
          Contact
        </a>

        <a
          href="/CV_CMC.pdf"
          class="button"
        >
          CV
        </a>

      </nav>

    </header>



    <main class="contact-page">

      <h1>
        Contact
      </h1>


      <div class="contact-grid">


        <!-- Address -->

        <section
          class="contact-item"
          aria-labelledby="address-label"
        >

          <p
            class="contact-label"
            id="address-label"
          >
            Address
          </p>

          <p class="contact-value">
            Girton College<br>
            University of Cambridge<br>
            Huntingdon Road<br>
            Cambridge CB3 0JG<br>
            United Kingdom
          </p>

        </section>



        <!-- Email -->

        <section
          class="contact-item"
          aria-labelledby="email-label"
        >

          <p
            class="contact-label"
            id="email-label"
          >
            Email
          </p>

          <p class="contact-value">

            <a href="mailto:cc2082@cam.ac.uk">
              cc2082@cam.ac.uk
            </a>

          </p>

        </section>



        <!-- X -->

        <section
          class="contact-item"
          aria-labelledby="x-label"
        >

          <p
            class="contact-label"
            id="x-label"
          >
            X
          </p>

          <p class="contact-value">

            <a
              class="contact-x-link"
              href="https://x.com/cmc_constantine"
              target="_blank"
              rel="noopener"
              aria-label="Collin Constantine on X"
            >

              <span
                class="contact-x-mark"
                aria-hidden="true"
              >
                𝕏
              </span>

              <span>
                @cmc_constantine
              </span>

            </a>

          </p>

        </section>


      </div>

    </main>



    <footer class="footer">

      <div>
        © <span id="y"></span> Collin M. Constantine
      </div>

    </footer>


  </div>



  <script>

    /* Current year */

    document.getElementById('y').textContent =
      new Date().getFullYear();



    /* Mobile navigation */

    document.addEventListener(
      'DOMContentLoaded',
      function () {

        const btn =
          document.getElementById('menu-btn');

        const nav =
          document.getElementById('site-nav');


        if (!btn || !nav) {
          return;
        }


        btn.addEventListener(
          'click',
          function () {

            const open =
              nav.classList.toggle('open');


            btn.setAttribute(
              'aria-expanded',
              open ? 'true' : 'false'
            );

          }
        );

      }
    );

  </script>


</body>
</html>
